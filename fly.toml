# fly.toml app configuration file generated for backend-restaurante on 2026-11-05T13:43:25Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'backend-restaurante'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'

[env]
  ASPNETCORE_ENVIRONMENT = 'Production'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
